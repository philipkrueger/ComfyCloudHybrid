name: Compatibility tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover tests
      - run: node --test tests/js/*.test.mjs

  comfyui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pack
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: v0.37.0
          path: ComfyUI
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ComfyUI/requirements.txt
      - run: python pack/scripts/check_comfyui.py ComfyUI --report compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfyui-compatibility
          path: compatibility.json
